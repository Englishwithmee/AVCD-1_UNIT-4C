</style><header><b>ENGLISH STUDIO · 4C</b><div class="toolbar"><button onclick="document.body.classList.toggle('focus')">Focus mode</button><button onclick="if(confirm('Reset this lesson’s answers?')){Object.keys(localStorage).filter(k=>k.startsWith('paris4c-')).forEach(k=>localStorage.removeItem(k));render()}">Reset</button></div></header><nav id="nav"></nav><main><div class="intro"><span class="tag">Reading → Grammar · University English</span><h1>A long weekend<br><em>in Paris.</em></h1><p class="muted">Read Charlotte’s posts. Discover the city.<br>Learn to talk about what is happening now.</p></div><div id="app"></div></main><footer>4C · A long weekend · Progress is saved in this browser.</footer><script>
const D={"posts": [["We’re going away for a long weekend. I’m so excited! We’re sitting on the train, and we’re waiting to leave for Paris on the Eurostar. I’m having a good time already!", "Chúng tôi đi chơi vào một kỳ nghỉ cuối tuần dài. Tôi hào hứng quá! Chúng tôi đang ngồi trên tàu và đợi khởi hành đến Paris bằng tàu Eurostar. Tôi đã thấy vui rồi!"], ["We’re here. We’re staying in a private apartment with a view of the city. It’s so romantic!", "Chúng tôi đến nơi rồi. Chúng tôi đang ở trong một căn hộ riêng có tầm nhìn ra thành phố. Thật lãng mạn!"], ["Today, we’re visiting the Rodin Museum. We’re walking around the beautiful gardens in the warm spring sunshine.", "Hôm nay, chúng tôi đang tham quan Bảo tàng Rodin. Chúng tôi đang đi dạo quanh những khu vườn xinh đẹp dưới ánh nắng xuân ấm áp."], ["Look, it’s the Eiffel Tower! I feel like a real tourist. We’re having a sandwich and waiting in line.", "Nhìn kìa, tháp Eiffel! Tôi thấy mình đúng là một du khách. Chúng tôi đang ăn bánh mì kẹp và xếp hàng chờ."], ["I’m having a good time, but Pete isn’t happy. We’re going shopping on the Champs-Élysées. He’s carrying my bags. I’m feeling hungry – time for lunch.", "Tôi đang rất vui, nhưng Pete thì không. Chúng tôi đang đi mua sắm trên đại lộ Champs-Élysées. Anh ấy đang xách túi cho tôi. Tôi thấy đói rồi – đến giờ ăn trưa thôi."], ["We’re at a lovely little restaurant. I’m having the steak! The weather’s lovely and warm. What’s Pete doing? He’s trying to speak French to the waiter.", "Chúng tôi đang ở một nhà hàng nhỏ xinh. Tôi đang ăn bít tết! Thời tiết thật đẹp và ấm áp. Pete đang làm gì nhỉ? Anh ấy đang cố nói tiếng Pháp với người phục vụ."], ["It’s late. We’re tired, and we’re taking a taxi back to the apartment after a great night out. The city lights are amazing!", "Đã muộn rồi. Chúng tôi mệt và đang đi taxi về căn hộ sau một buổi tối đi chơi tuyệt vời. Ánh đèn thành phố đẹp quá!"], ["It’s our last day. We’re buying some food to take home. It’s raining, but we don’t mind.", "Đây là ngày cuối cùng của chúng tôi. Chúng tôi đang mua ít đồ ăn mang về nhà. Trời đang mưa, nhưng chúng tôi không ngại."]], "photos": ["data:image/webp;base64,UklGRnopAABXRUJQVlA4IG4pAAAQgACdASrMAIgAPiEOhUIhhcaVsQYAgSygFufqklIxJ43/eeafy33k/UdK+sZyp5NvS3/a9I3q5/W+93/dv1P/tz+wHuv/9j1/f4H1LP6r/wOuP9FPpmvKywWfjnid+O/Nf4P++ftP/ff/d7zuOfrr/x/QT+R/c78z/gv3O/w37p/IH/D/ufjz8T/7r1CPyP+Yf4D8uP8X+6v0w/S/8jvXNi/x//W9RH2M+qf6z/A/ub/gPS4/1/Rn7B+wD/Pv6j/vf7/7df9Xww/yP+/9gb+q/47/r/578oPpi/uP/V/qP9n+7/ut+m//N/pfgL/nf9l/4X+F/zn/t/03///+flA/ef2if3HUGXBHw5Wiy9qBzGJMuK3r0KTQlZCD2Jz/N+e6CIiZ3TyE2LfP5fCWNaUCVVFihKZuXJ3fSbx1HpcFpUlPome/msOk2yg0RGeb7cfXFd4hZXMTQPg5D7X/UV1P7+wFZVz/YfBJ4uAGcY7W9Ozu4Q1aYw4YQsjOx7BMKn+Vun58YecbLemCa8bsNipNb7LXcyT0mbI8kT12s+nY4xIb+YNMyWr+Ry4iWiLs/t2iqdt1N9EzfAHdyJjxp4l7Op1cAdGhl4Ug5IvzupBu1Wicmwp+n/HLXQj19YwPNX3/J+HnZcmZJ/jGi0UI4/9gxS9Oo0v/8RWuPUwx0C8C6kNMokIpuKC8N9BWj+ew5R7m1LOXGuS3I4W5at4Jjvx8JRVx9cymBG2+l4qoKvlUaZkmhDK/U150x4Bvqb1ehJ+IUoLjq7d0H7E9Csuqc4sdYrW1/KyUWF1d2ELFXy0NGA1zUstZKevsGCav3QHTJ6HC9BYdqaQlUvdICyJJO+nMhCJlh437G3TSbcFuKqPnL8mrg8m2IPtdwpQKnXQEW3668hO9p5I7MDkIJ3yRalrRE8mQluPbAfrY41wcXGefSYRgiR/4xLO2FB87J2k/tJKG9Whqfz5qUmKSCyNAqg7rSt2H0ETzYZqq9qNQs2zWxR9YFTwB0mRDpE7TzMF/+uXawd87dZrFVYZqhNpGlM5RjtfYJRi0crmaVtotm/3rzSg7Qq18fp2ovA+YbGcMDBRcNwSUf1UjX2I7Ye0B08KFRw5GS+NRlz7DNG3D/kDLsFgjsi/ve8NRtn/CAFf9Jx2VrTmLEkka4+siqaUZL4eQvHCYsqZ2B2iL5LM6Fw4EEoHK68PstNN37vZ7aYFPDAa/FDjJTG27B97/kixVArQdV2+7lgqQK5q2Z4oziIZbT2b8O6ZIhaKFfFi6lLXNmRax73nIKWBFdX9qA6JXI91o+IJnn/rcaxJs6ssU4hmNNOAvVGmk3cXCkMxDDABGv64Mg8tVgENaJZjJvfnkO74nESxIoU5a813AAP7/3xYIPud8/R5tZTBSer382OQvK0iDYFkO+V+KIV81xMPLEy1q40y9nq5f0/+bwkmPUCUxOT+/j8XCUV/Ga42cpW4ebG3ISNJ2qEV3tMj86NccpTa///GG/gS0NOGOl5hafX9gmEwdCxWFKpCbr3rCIW7I0Kbg3GL1bB/A77phILk+FSAA5v/ISNQ/VwvOREUBJS88yjxZ7BeT3GSs0SIK8mV7bAMy8NU+Z/KteBP/mk/Sv59UYGOe0VfNKtX8R6JIlY82EdCyF7L0dy+f3mJ+pfBt3ZS243CJj5mrhP8226xHZnE39cHfmH7aIcFj0jwD/+wix+tkfvviYDmGOcvsYlTHvkjEOl77TT5lezLcC330z/dfVLwoDo3qrlzti81LNTlBARzITmUFh1tm4/QFAZcwrdYKJPo4nO7Bv function reading(){return `<span class="tag">Reading · page 34</span><h2>Let’s take a little trip.</h2><div class="panel"><h3>Before you read</h3><p>What do you like doing when you visit a new city? Tell your partner.</p><details><summary>Useful language</summary><p>I like visiting… / taking photos / trying local food / going shopping.</p></details></div><div class="toolbar"><b>Charlotte’s travel posts · a–h</b><button onclick="allTranslations()">Dịch / Ẩn tất cả</button></div><p>Which city are Charlotte and Pete in? Which famous places does Charlotte mention?</p><div class="grid">${D.posts.map((p,i)=>`<article class="panel"><img class="photo" src="${D.photos[i]}" alt="${['Eurostar train','Apartment view of Paris','Rodin Museum garden','Eiffel Tower','Shopping on the Champs-Élysées','Steak and fries','Paris at night','French food shop'][i]}"><p class="post-title">Post ${String.fromCharCode(97+i)}</p><p>${p[0]}</p><button onclick="toggle('tr${i}')">Dịch tiếng Việt</button><div id="tr${i}" class="translation" hidden>${p[1]}</div></article>`).join('')}</div><div class="panel"><h3>Check your ideas</h3><details><summary>Show the city and places</summary><p>They are in <b>Paris</b>. Charlotte mentions the <b>Rodin Museum</b>, the <b>Eiffel Tower</b> and the <b>Champs-Élysées</b>.</p></details></div><button class="primary" onclick="go(1)">Reading practice →</button>`}
function mc(id,q,opts,a,why=''){return `<div class="question" data-id="${id}" data-a="${a}"><b>${q}</b><div class="choices">${opts.map((t,i)=>`<button data-v="${i}" onclick="choose('${id}',${i})">${t}</button>`).join('')}</div><button onclick="check('${id}')">Check answer</button><div class="feedback" aria-live="polite" data-why="${why}"></div></div>`}function choose(id,i){save(id,i);let e=document.querySelector('[data-id="'+id+'"]');e.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('selected',+b.dataset.v===i));e.querySelector('.feedback').textContent=''}function check(id){let e=document.querySelector('[data-id="'+id+'"]'),v=get(id),f=e.querySelector('.feedback'),ok=v===+e.dataset.a;f.className='feedback '+(ok?'good':'bad');f.textContent=v===null?'Choose an answer first.':ok?'✓ Correct. '+f.dataset.why:'Try again. Check the sentence and the clue.'}

function readPractice(){return `<span class="tag">Read again · Find the evidence</span><h2>What do the posts tell us?</h2><button onclick="go(0)">← Back to the reading</button>${[['Do they like their apartment?',['Yes. They think it’s romantic.','No. It’s too small.','They don’t say.'],0,'Post b: “It’s so romantic!”'],['What’s the weather like?',['Cold and snowy throughout the trip.','Warm and sunny, with rain on the last day.','Rainy every day.'],1,'Posts c, f and h.'],['How do they travel around?',['They only use the train.','They cycle everywhere.','They walk and take a taxi when they are tired.'],2,'Post c: walking. Post g: taking a taxi.'],['Do they like the food?',['Yes. They buy some food to take home.','No. They dislike French food.','They don’t eat at restaurants.'],0,'Posts f and h.']].map((q,i)=>mc('read'+i,(i+1)+'. '+q[0],q[1],q[2],q[3])).join('')}<h2>Match Pete’s posts 1–8 with pictures a–h.</h2><p>Tap a letter. Open the picture guide whenever you need it.</p><details><summary>Picture guide · a–h</summary><div class="grid">${D.photos.map((s,i)=>`<div><b>${String.fromCharCode(97+i)}</b><img class="photo" src="${s}" alt="Picture ${String.fromCharCode(97+i)}"></div>`).join('')}</div></details>${pete.map((p,i)=>mc('match'+i,(i+1)+'. '+p,Array.from('abcdefgh'),[7,2,0,1,3,4,6,5][i])).join('')}<h2>Notice the verbs</h2><div class="panel"><p>“I’m looking…” · “We’re having…” · “Charlotte’s taking…”</p><p>These verb phrases describe actions happening now.</p></div>${mc('rule','We form the present continuous with…',['have + -ing','be + -ing'],1)}<button class="primary" onclick="go(2)">Learn the grammar →</button>`}
function grammar(){return `<span class="tag">Grammar · Present continuous</span><h2>What’s happening now?</h2><div class="grid"><div class="panel"><h3>Actions happening now</h3><p>I’m taking a shower.<br>It’s raining.<br>What are you reading?</p></div><div class="panel"><h3>Temporary situations</h3><p>We’re staying in a hotel.<br>I’m not working this week.</p></div></div><div class="panel"><h3>Subject + am / is / are + verb-ing</h3><table><tr><th>Subject</th><th>Positive</th><th>Negative</th></tr><tr><td>I</td><td>I’m getting dressed.</td><td>I’m not watching TV.</td></tr><tr><td>He / She / It</td><td>He’s getting dressed.</td><td>She isn’t watching TV.</td></tr><tr><td>You / We / They</td><td>They’re getting dressed.</td><td>We aren’t watching TV.</td></tr></table><h3>Questions & short answers</h3><p><b>Am</b> I sleeping? → Yes, you are. / No, you aren’t.</p><p><b>Is</b> she sleeping? → Yes, she is. / No, she isn’t.</p><p><b>Are</b> they sleeping? → Yes, they are. / No, they aren’t.</p><p><b>Where are you going?</b> → Question word + be + subject + verb-ing.</p><button onclick="toggle('vnGrammar')">Giải thích tiếng Việt</button><div id="vnGrammar" class="translation" hidden>Thì hiện tại tiếp diễn diễn tả hành động đang xảy ra hoặc tình huống mang tính tạm thời. Dùng am với I; is với he/she/it và chủ ngữ số ít; are với you/we/they và chủ ngữ số nhiều. Phủ định: thêm not sau am/is/are. Câu hỏi: đưa am/is/are lên trước chủ ngữ.</div></div><div class="panel"><h3>Spelling: the -ing form</h3><table><tr><th>Rule</th><th>Examples</th></tr><tr><td>Usually add -ing</td><td>play → playing · talk → talking</td></tr><tr><td>Consonant + e: remove e</td><td>take → taking · live → living<br>Exception: be → being</td></tr><tr><td>One syllable ending consonant–vowel–consonant: double the final consonant</td><td>sit → sitting · plan → planning</td></tr></table></div><div class="hint"><b>Time expressions:</b> (right) now · today · this week/month/year · at the moment<br>I’m having breakfast right now. / I’m studying a lot this month.</div><button class="primary" onclick="go(3)">Try the textbook exercises →</button>`}
const order=['Is Ella using the computer?','I am visiting my parents.','Matt is reading the newspaper.','My phone isn’t working.','We are staying at a hotel this weekend.','Where are you going?'];
const gap=[['I ___ dinner right now. (have)',['am having','is having','have'],0],['We ___ to the beach now. (go)',['go','are going','is going'],1],['The Internet ___ today. (not work)',['aren’t working','doesn’t working','isn’t working'],2],['___ Tim ___ a shower? (take)',['Is / taking','Are / taking','Does / taking'],0],['She ___ a coat today. (not wear)',['don’t wearing','isn’t wearing','aren’t wearing'],1],['What ___ you ___? (do)',['is / doing','do / doing','are / doing'],2],['I ___ today because it’s Saturday! (not study)',['am not studying','isn’t studying','don’t studying'],0],['___ I ___ in the right place? (sit)',['Is / sitting','Am / sitting','Are / sitting'],1]];
function build(id,s){let ts=s.split(' '),sh=ts.map((t,i)=>({t,i})).sort((a,b)=>((a.i*7+5)%19)-((b.i*7+5)%19));return `<div class="question build" data-build="${id}" data-target="${encodeURIComponent(s)}"><b>${+id.slice(1)+1}. Arrange the words.</b><div class="drop" ondragover="event.preventDefault()" ondrop="drop(event,'${id}')"></div><div class="bank">${sh.map(o=>`<button class="token" data-token="${o.i}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${id}|${o.i}')" onclick="move('${id}',${o.i})">${o.t}</button>`).join('')}</div><button onclick="checkBuild('${id}')">Check answer</button> <button onclick="resetBuild('${id}')">Reset sentence</button><div class="feedback" aria-live="polite"></div></div>`}function move(id,i){let e=document.querySelector('[data-build="'+id+'"]'),b=e.querySelector('[data-token="'+i+'"]');(b.parentElement.className==='bank'?e.querySelector('.drop'):e.querySelector('.bank')).appendChild(b);save(id,[...e.querySelector('.drop').children].map(b=>+b.dataset.token));e.querySelector('.feedback').textContent=''}function drop(ev,id){ev.preventDefault();let [from,i]=ev.dataTransfer.getData('text/plain').split('|');if(from===id){let e=document.querySelector('[data-build="'+id+'"]');if(e.querySelector('[data-token="'+i+'"]').parentElement.className==='bank')move(id,i)}}function resetBuild(id){let e=document.querySelector('[data-build="'+id+'"]');[...e.querySelector('.drop').children].forEach(b=>e.querySelector('.bank').appendChild(b));save(id,[]);e.querySelector('.feedback').textContent=''}function checkBuild(id){let e=document.querySelector('[data-build="'+id+'"]'),s=[...e.querySelector('.drop').children].map(b=>b.textContent).join(' '),ok=s===decodeURIComponent(e.dataset.target),f=e.querySelector('.feedback');f.className='feedback '+(ok?'good':'bad');f.textContent=ok?'✓ Correct.':'Try again. Check the subject, be and the -ing form.'}
function practice(){return `<span class="tag">Grammar practice · page 119</span><h2>Put it into practice.</h2><h3>1 · Put the words in order</h3><p>Drag words into the box, or tap them. Tap a placed word to return it.</p>${order.map((s,i)=>build('b'+i,s)).join('')}<h2>2 · Complete the sentences</h2><p>Choose the correct present continuous form.</p>${gap.map((q,i)=>mc('gap'+i,(i+1)+'. '+q[0],q[1],q[2])).join('')}<h2>3 · Look, ask & answer</h2><div class="panel"><img src="${D.scene}" style="width:min(100%,400px);border-radius:15px" alt="A man wearing glasses and a woman standing in the rain"><p>Use the picture to choose a question and a true short answer.</p></div>${[['they / talk',['Are they talking? — No, they aren’t.','Is they talking? — No, they isn’t.','Are they talking? — Yes, they are.'],0],['they / have / a good time',['Are they having a good time? — Yes, they are.','Are they having a good time? — No, they aren’t.','Is they having a good time? — No, they isn’t.'],1],['it / snow',['Does it snowing? — No, it doesn’t.','Is it snowing? — Yes, it is.','Is it snowing? — No, it isn’t.'],2],['it / rain',['Is it raining? — Yes, it is.','Is it raining? — No, it isn’t.','Are it raining? — Yes, it are.'],0],['she / carry / an umbrella',['Are she carrying an umbrella? — No, she aren’t.','Is she carrying an umbrella? — No, she isn’t.','Is she carrying an umbrella? — Yes, she is.'],1],['he / wear / glasses',['Does he wearing glasses? — Yes, he does.','Is he wearing glasses? — No, he isn’t.','Is he wearing glasses? — Yes, he is.'],2]].map((q,i)=>mc('pic'+i,(i+1)+'. '+q[0],q[1],q[2])).join('')}<div class="panel"><h3>Quick speaking check</h3><p>Look around your classroom. Say three things that are happening now.</p><p class="muted">“Our teacher is…” · “My partner is…” · “We are…”</p></div><button onclick="go(0)">Back to the reading</button>`}
function render(){$('#nav').innerHTML=tabs.map((t,i)=>`<button class="${page===i?'active':''}" onclick="go(${i})">${t}</button>`).join('');$('#app').innerHTML=[reading,readPractice,grammar,practice][page]();document.querySelectorAll('[data-id]').forEach(e=>{let v=get(e.dataset.id);e.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('selected',+b.dataset.v===v))});document.querySelectorAll('[data-build]').forEach(e=>(get(e.dataset.build)||[]).forEach(i=>{let b=e.querySelector('[data-token="'+i+'"]');if(b)e.querySelector('.drop').appendChild(b)}))}render();
</script></html>
